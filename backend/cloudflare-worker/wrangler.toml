name = "xmax-chat-backend"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
FIREBASE_PROJECT_ID = "gen-lang-client-0461366135"
FIRESTORE_DB_ID = "ai-studio-android-xteam-28ae82d9-933c-4b9e-8445-3ca11186cacb"
# Leave empty for native mobile clients (prevents wildcard CORS on authenticated endpoints).
# Add comma-separated origins only if a web dashboard calls this Worker directly.
ALLOWED_ORIGINS = ""

# Free-Tier Cloudflare R2 Object Storage (10 GB/month, 1M Class A ops, 10M Class B ops, $0 egress)
# Create once via: npx wrangler r2 bucket create xmax-chat-files
[[r2_buckets]]
binding = "CHAT_BUCKET"
bucket_name = "xmax-chat-files"

# Optional FCM HTTP v1 push notifications secret (set via Wrangler CLI, never commit):
#   npx wrangler secret put SERVICE_ACCOUNT_JSON
